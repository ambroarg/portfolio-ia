server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sans Cache-Control explicite, le navigateur applique une mise en cache
    # heuristique et peut resservir un CSS perime apres un rebuild. "no-cache"
    # n'interdit pas le cache : il impose une revalidation, qui renvoie un 304
    # de quelques octets si rien n'a change. Negligeable pour un petit site.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers statiques doivent renvoyer un vrai 404 quand ils manquent,
    # sinon le repli ci-dessus leur sert index.html avec un code 200.
    location /src/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # L'API est proxifiee sur la meme origine : plus aucun probleme de CORS,
    # et le frontend n'a pas besoin de connaitre l'URL du backend.
    location ~ ^/(chat|health|docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Indispensable pour le streaming SSE : sans ca nginx accumule la
        # reponse et le visiteur recoit tout d'un bloc a la fin.
        proxy_buffering off;
        proxy_cache off;

        # Une generation depasse largement les 60 s par defaut sur CPU.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
