# Ce fichier est inclus dans le bloc http{} de nginx (via conf.d/), ce qui
# permet d'y declarer log_format et limit_req_zone, interdits dans server{}.

# Journal sans adresse IP : la feuille de confidentialite promet qu'aucune
# conversation n'est enregistree, et une IP reste une donnee personnelle au
# sens du RGPD. On garde de quoi diagnostiquer (statut, chemin, duree).
log_format sans_ip '$time_iso8601 "$request" $status $body_bytes_sent $request_time';

# Une generation mobilise le LLM pendant plusieurs secondes : sans plafond, un
# seul script sature le serveur. 20 requetes/minute par IP, avec une rafale de
# 5 pour ne pas penaliser un visiteur qui enchaine les questions.
# L'IP ne sert que de cle en memoire partagee ; elle n'est ni journalisee ni
# persistee.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log sans_ip;

    # Par defaut limit_req journalise "client: <IP>" au niveau error, ce qui
    # rendrait l'anonymisation ci-dessus inutile. Le niveau info passe sous le
    # seuil "notice" de l'image, donc rien n'est ecrit. Les rejets restent
    # visibles dans le journal d'acces sous la forme d'un 503.
    limit_req_log_level info;

    # L'image de base laisse gzip desactive. Sans lui, le CSS et le JS partent
    # en clair : ~29 Ko au lieu de ~10 Ko par visite a froid.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Ces en-tetes ne sont declares qu'ici : nginx n'herite des "add_header"
    # d'un niveau superieur que si le niveau courant n'en declare aucun. C'est
    # pourquoi la mise en cache passe par "expires" plus bas et non par un
    # add_header dans chaque location, qui ferait silencieusement disparaitre
    # toute cette section.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # Pas de repli SPA vers index.html : le site n'a qu'une page et aucun
    # routeur cote client. Un "=404" evite de servir index.html avec un code
    # 200 a la place d'un asset manquant, pour tout dossier present ou futur.
    #
    # "expires -1" envoie Cache-Control: no-cache, qui n'interdit pas le cache
    # mais impose une revalidation : un 304 de quelques octets si rien n'a
    # change. Sans lui le navigateur peut resservir un CSS perime.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    # Les binaires ne changent qu'en changeant de nom : inutile de les
    # revalider a chaque chargement, contrairement au CSS et au JS.
    location /src/assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # L'API est proxifiee sur la meme origine : plus aucun probleme de CORS,
    # et le frontend n'a pas besoin de connaitre l'URL du backend.
    location ~ ^/(chat|health|docs|redoc|openapi\.json) {
        limit_req zone=api burst=5 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Indispensable pour le streaming SSE : sans ca nginx accumule la
        # reponse et le visiteur recoit tout d'un bloc a la fin.
        proxy_buffering off;
        proxy_cache off;

        # Une generation depasse largement les 60 s par defaut sur CPU.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
