server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # L'API est proxifiee sur la meme origine : plus aucun probleme de CORS,
    # et le frontend n'a pas besoin de connaitre l'URL du backend.
    location ~ ^/(chat|health|docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Indispensable pour le streaming SSE : sans ca nginx accumule la
        # reponse et le visiteur recoit tout d'un bloc a la fin.
        proxy_buffering off;
        proxy_cache off;

        # Une generation depasse largement les 60 s par defaut sur CPU.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
